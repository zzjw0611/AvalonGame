name: Android internal APK
on:
  workflow_dispatch:
  push:
    branches: ['feat/native-mobile-mvp']
    paths: ['mobile/**', '.github/workflows/android-preview.yml']
permissions:
  contents: read
concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
      NODE_ENV: production
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run typecheck && npm test && npm run check:expo
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Compile standalone arm64 internal APK
        # The Expo template signs release variants with its test/debug key by default.
        # This is ONLY an internal evaluation package, not a Play Store release.
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2
        working-directory: mobile/android
      - name: Collect artifact
        run: |
          mkdir -p internal-artifact
          cp android/app/build/outputs/apk/release/app-release.apk internal-artifact/avalon-arm64-internal.apk
          cp package-lock.json internal-artifact/package-lock.json
          printf '%s\n' 'INTERNAL EVALUATION ONLY. ARM64 Android. Expo template test/debug signing key, NOT a private release signature. Connect to your HTTPS game server; no model credentials are bundled. Rebuild with owner-controlled signing before distribution.' > internal-artifact/README.txt
          sha256sum internal-artifact/avalon-arm64-internal.apk > internal-artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: avalon-android-arm64-internal
          path: mobile/internal-artifact/
          if-no-files-found: error
          retention-days: 14
