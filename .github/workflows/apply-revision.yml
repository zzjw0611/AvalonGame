name: Apply and validate mobile 0.2.0
on:
  push:
    branches: ['feat/native-mobile-mvp']
    paths: ['.github/workflows/apply-revision.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'zzjw0611/AvalonGame' && github.ref == 'refs/heads/feat/native-mobile-mvp'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply checksum-verified local revision
        shell: bash
        run: |
          python - <<'PY'
          import base64, bz2, hashlib, json, subprocess
          from pathlib import Path
          encoded = ''.join(Path(f'.maintenance/part-{i}.txt').read_text().strip() for i in range(5))
          raw = bz2.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '7e79f17b99c358a5d73b8833a0aa5b9a17ba9b97119d8c54e52986dbb02a45a4'
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          for change in json.loads(raw):
              path = Path(change['p'])
              assert not path.is_absolute() and '..' not in path.parts and not path.is_symlink()
              before = path.read_bytes() if path.exists() else None
              assert (blob(before) if before is not None else None) == change['old'], str(path)
              if change['new'] is None:
                  path.unlink()
                  continue
              lines = (before or b'').decode('utf-8').splitlines(keepends=True)
              for start, end, replacement in reversed(change['edits']):
                  lines[start:end] = replacement.splitlines(keepends=True)
              after = ''.join(lines).encode('utf-8')
              assert blob(after) == change['new'], str(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(after)
          for i in range(5):
              Path(f'.maintenance/part-{i}.txt').unlink()
          Path('.github/workflows/apply-revision.yml').unlink()
          subprocess.run(['git', 'add', '-A'], check=True)
          actual = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert actual == 'cc8a27c6cd2241a0c2e9e57752e2307a4372bfdc', actual
          print('Verified exact locally tested source tree:', actual)
          PY
      - name: Commit source without overwriting concurrent changes
        id: commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: fixed-server mobile rooms with human and AI players only'
          git push origin HEAD:feat/native-mobile-mvp
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  backend:
    needs: apply
    runs-on: ubuntu-latest
    env:
      POSTGRES_TEST_URL: postgresql+psycopg://avalon:ci-only-password@127.0.0.1:5432/avalon_ci
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: avalon
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: avalon_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U avalon -d avalon_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r backend/requirements-dev.txt
      - run: PYTHONPATH=. pytest -q
        working-directory: backend
  mobile:
    needs: apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --include=dev --no-audit --no-fund
        working-directory: mobile
      - run: npm run typecheck && npm test && npm run check:expo
        working-directory: mobile
      - run: npx expo export --platform android --output-dir dist/android && npx expo export --platform ios --output-dir dist/ios
        working-directory: mobile
  apk:
    needs: [apply, backend, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --include=dev --no-audit --no-fund
        working-directory: mobile
      - run: npx expo prebuild --platform android --no-install
        working-directory: mobile
      - name: Compile independent ARM64 test APK
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2
        working-directory: mobile/android
      - name: Collect build and source metadata
        shell: bash
        run: |
          mkdir -p artifact
          cp mobile/android/app/build/outputs/apk/release/app-release.apk artifact/avalon-0.2.0-arm64-internal.apk
          git rev-parse HEAD > artifact/SOURCE_COMMIT.txt
          sha256sum artifact/avalon-0.2.0-arm64-internal.apk > artifact/SHA256SUMS.txt
          printf '%s\n' 'INTERNAL TEST ONLY. ARM64 Android 0.2.0. Signed with public template test key, not owner release key. Default server https://42.193.181.239 requires a trusted IP certificate. No server or model credentials bundled. Real-device and deployment acceptance not performed.' > artifact/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: avalon-0.2.0-android-arm64-internal
          path: artifact/
          if-no-files-found: error
          retention-days: 14
