name: Source snapshot
on:
  push:
    branches: ['feat/native-mobile-mvp']
    paths: ['.github/workflows/source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar HEAD -o source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: avalon-tracked-source
          path: source.tar
          retention-days: 2
